    # target_func: 'LoadAllSFXs'

  - name: YoshiSFXFix1
    type: branch_insn
    branch_type: bl
    src_addr_pal: 0x8014FBAC
    target_func: 'fuckingYoshiStuff(void)'

  - name: YoshiSFXFix2
    type: branch_insn
    branch_type: bl
    src_addr_pal: 0x8014FC6C
    target_func: 'fuckingYoshiStuff(void)'

