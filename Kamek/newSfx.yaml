--- # By Asu, converted by Synel for Newer 1.3.X, added dynamic loading and unloading feature by Walid
source_files: [../src/newSfx.S, ../src/newSfx.cpp, ../src/newSfx_dynamicLoadingAndUnloading.cpp, ../src/newSfx_dynamicLoadingAndUnloading.S]
hooks:
  - name: SFXHax
    type: branch_insn
    branch_type: b
    src_addr_pal: 0x801951D0        #Called before NewSFXHax, so this patch will load the SFXs
    target_func: 'SFXHax'

  - name: NewSFXHax
    type: branch_insn
    branch_type: b
    src_addr_pal: 0x80283CE0
    target_func: 'NewSFXHax'

